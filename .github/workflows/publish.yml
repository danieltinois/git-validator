name: Publish package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          package_name=$(npm pkg get name | tr -d '"')
          package_version=$(npm pkg get version | tr -d '"')
          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on GitHub Packages; skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare npm package name
        run: |
          npm pkg set name=git-validator-cli
          npm pkg delete publishConfig
          echo "Publishing $(npm pkg get name)@$(npm pkg get version) to npm"

      - name: Publish to npm
        shell: bash
        run: |
          package_version=$(npm pkg get version | tr -d '"')
          if npm view "git-validator-cli@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "git-validator-cli@${package_version} already exists on npm; skipping."
          else
            npm publish --registry=https://registry.npmjs.org --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        run: npm view git-validator-cli@$(npm pkg get version | tr -d '"') version --registry=https://registry.npmjs.org
